<div class="todo-app p-8 max-w-lg mx-auto bg-white dark:bg-gray-900 rounded-3xl shadow-2xl">
    <!-- App Title -->
    <h1 class="app-title text-4xl font-bold text-center mb-8 text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-blue-600 dark:from-purple-400 dark:to-blue-400">
        <span class="text-gray-800 dark:text-gray-200">✨</span> My Todo List
    </h1>
  
    <!-- Todo Input Form -->
    <form class="todo-form flex gap-4 mb-8" autocomplete="off" (ngSubmit)="addTodo()">
      <input
        type="text"
        name="inputTodo"
        placeholder="What needs to be done?"
        class="todo-input flex-grow p-4 border-2 border-gray-200 dark:border-gray-700 rounded-2xl shadow-sm text-gray-700 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:border-purple-500 dark:focus:border-purple-400 focus:ring-2 focus:ring-purple-200 dark:focus:ring-purple-800 transition-all bg-white dark:bg-gray-800"
        [(ngModel)]="inputTodo"
      />
      <button type="submit" class="add-todo bg-gradient-to-r from-purple-600 to-blue-600 dark:from-purple-500 dark:to-blue-500 text-white p-4 rounded-2xl hover:from-purple-700 hover:to-blue-700 dark:hover:from-purple-600 dark:hover:to-blue-600 transition-all transform hover:scale-105 active:scale-95 shadow-lg">
        ➕ Add Task
      </button>
    </form>
  
    <!-- Todo List -->
    <div class="todo-list space-y-4">
      @for (todo of todos; track $index) {
        <div class="todo flex items-center justify-between p-4 bg-gray-50 dark:bg-gray-800 rounded-2xl shadow-sm hover:shadow-md transition-all transform hover:scale-101 border-2 border-gray-100 dark:border-gray-700" 
             [ngClass]="{'completed-todo': todo.completed}">
          <!-- Custom Checkbox -->
          <div class="todo-checkbox flex items-center cursor-pointer" (click)="toggleDone($index)">
            <div class="custom-checkbox w-6 h-6 rounded-lg border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center transition-all"
                 [ngClass]="{'bg-gradient-to-r from-purple-600 to-blue-600 border-transparent': todo.completed}">
              @if (todo.completed) {
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
              }
            </div>
          </div>
  
          <!-- Edit Mode -->
          @if (editingIndex === $index) {
            <input
              type="text"
              [(ngModel)]="editedTodo"
              class="todo-edit-input flex-grow mx-4 p-2 border-2 border-gray-200 dark:border-gray-700 rounded-xl shadow-sm text-gray-700 dark:text-gray-200 focus:outline-none focus:border-purple-500 dark:focus:border-purple-400 focus:ring-2 focus:ring-purple-200 dark:focus:ring-purple-800 transition-all bg-white dark:bg-gray-800"
            />
            <button class="save-edit text-green-600 dark:text-green-400 hover:text-green-700 dark:hover:text-green-500 transition-colors transform hover:scale-110 active:scale-95" (click)="saveEdit($index)">
              💾
            </button>
            <button class="cancel-edit text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 transition-colors transform hover:scale-110 active:scale-95" (click)="cancelEdit()">
              ❌
            </button>
          } @else {
            <!-- Todo Content -->
            <div class="todo-content flex-grow mx-4 cursor-pointer text-gray-700 dark:text-gray-200 hover:text-gray-900 dark:hover:text-gray-100 transition-colors" (click)="toggleDone($index)">
              {{ todo.content }}
            </div>
            <!-- Edit Button -->
            <button class="edit-todo text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-500 transition-colors transform hover:scale-110 active:scale-95" (click)="startEdit($index, todo)">
              ✏️
            </button>
          }
  
          <!-- Delete Button -->
        <button class="delete-todo text-red-600 dark:text-red-400 hover:text-red-700 dark:hover:text-red-500 transition-colors transform hover:scale-110 active:scale-95" (click)="deleteTodo($index)">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
          </button>
        </div>
      }
    </div>
  </div>
