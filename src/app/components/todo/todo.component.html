<div class="todo-app p-6 max-w-md mx-auto bg-gradient-to-br from-purple-50 to-blue-50 rounded-2xl shadow-2xl">
    <h1 class="app-title text-3xl font-bold text-center mb-6 text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-blue-500">
        <span class="text-black">✨</span> Todo List
    </h1>
    <form class="todo-form flex gap-3 mb-6">
        <input
            type="text"
            name="inputTodo"
            placeholder="What needs to be done?"
            class="todo-input flex-grow p-3 border-0 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-opacity-50 transition-all"
            [(ngModel)]="inputTodo"
        />
        <button class="add-todo bg-gradient-to-r from-purple-600 to-blue-500 text-white p-3 rounded-xl hover:from-purple-700 hover:to-blue-600 transition-all transform hover:scale-105 active:scale-95 shadow-lg"  (click)="addTodo()" >
            ➕ Add Task
        </button>
    </form>
    <div class="todo-list space-y-3">
        @for (todo of todos; track $index) {
            <div class="todo flex items-center justify-between p-3 bg-white rounded-xl shadow-md hover:shadow-lg transition-all transform hover:scale-102" [ngClass]="{'opacity-75': todo.completed}">
                <div class="todo-checkbox flex items-center cursor-pointer" (click)="toggleDone($index)">
                    @if (todo.completed) {
                        <span class="checkmark text-2xl text-green-500 hover:text-green-600 transition-colors">✔️</span>
                    } @else {
                        <span class="checkmark-placeholder w-5 h-5 border-2 border-gray-300 rounded-full hover:border-purple-500 transition-colors"></span>
                    }
                </div>
                <div class="todo-content flex-grow mx-3 cursor-pointer text-gray-700 hover:text-gray-900 transition-colors" (click)="toggleDone($index)">
                    {{ todo.content }}
                </div>
                <button class="delete-todo text-red-500 hover:text-red-700 transition-colors transform hover:scale-110 active:scale-95" (click)="deleteTodo($index)">
                    🗑️
                </button>
            </div>
        }
    </div>
</div>
